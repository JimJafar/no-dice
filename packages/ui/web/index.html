<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The one meta the viewer's page does not need and this one does: that page is a
     fixed 1920 × 1080 frame, so a phone shows it shrunk and there is nothing to fit;
     this page is as wide as the window it is read in, and without this it is laid out
     at a desktop's width and shrunk to a phone's, at a size no one can tap. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No Dice console</title>
<!-- The viewer's own fonts link, character for character: `IBM Plex Sans` 400/500/600
     for the page's sentences, `Barlow Semi Condensed` 500/600/700 for its headings, its
     buttons and the figures in its tables. The console wears the replay viewer's design
     rather than a second one beside it, and asks for the same faces to do it. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/console.css">
</head>
<body>
<div id="frame" class="frame">
<h1>No Dice console</h1>
<p id="status" class="status" role="status"></p>
<!-- The four views the console opens on, named by the URL hash and mounted by `src/views.ts`, which draws the nav links into the `<nav>` below and hides the views that are not showing. The five sections keep the ids and headings the renderer modules own them by; only which view holds each one has changed. -->
<nav id="nav" class="nav" aria-label="Console views"></nav>
<div id="view-matches" class="view"><section id="results" class="section"><h2>Results</h2></section></div>
<div id="view-runs" class="view"><section id="start" class="section"><h2>Start a run</h2></section><section id="progress" class="section"><h2>Progress</h2></section></div>
<div id="view-leaderboard" class="view"><section id="leaderboard" class="section"><h2>Leaderboard</h2></section></div>
<div id="view-providers" class="view"><section id="providers" class="section"><h2>Providers</h2></section></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
