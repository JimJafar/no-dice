packages:
  - "packages/*"
  - "games/salient/*"

# `salient-log/1` has a package of its own, `@no-dice/log`, so no workspace package
# depends back on `@no-dice/runner`: the server answers with the log shapes of
# `@no-dice/log`, and the stats package will read them from the same place. The
# cycle pnpm used to warn about — `bots` → `server` → `runner` → `harness` →
# `bots` — went with the `server` → `runner` edge, and nothing here installs or
# builds in a loop.
