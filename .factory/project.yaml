repo: git@github.com:JimJafar/no-dice.git

# The scaffold task created the pnpm workspace; install it before the gates run.
setup:
  - pnpm install

gates:
  # Pins the behaviour the new engine must reproduce. Passes today, must keep passing.
  - name: reference-replay
    run: node salient/docs/reference/replay-check.js salient/docs/golden/*.json

  - name: typecheck
    run: pnpm typecheck

  - name: tests
    run: pnpm test
    expect:
      minTests: previous

  # The viewer is a browser app the root tsconfig project deliberately excludes,
  # so `tsc` alone would not notice a viewer that cannot be bundled.
  - name: viewer-build
    run: pnpm --filter @no-dice/salient-viewer build
