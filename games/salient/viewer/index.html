<!doctype html>
<!-- salient replay viewer — built by `pnpm --filter @no-dice/salient-viewer build`, and served by the
     console at `/viewer/`, where `?log=<url>` opens a log it serves at `/logs/<path>`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salient replay viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/viewer.css">
</head>
<body>
<div id="frame" class="frame">
<div id="load" class="load">
<div class="load-title">SALIENT REPLAY VIEWER</div>
<p id="status" class="status" role="status"></p>
<label class="pick" id="log-pick"><input id="log-file" type="file" multiple accept=".json,application/json">Choose a match log, and its showcase.json</label>
<div class="hint" id="log-hint">…or drop a log anywhere on this frame, or open the page as <code>?log=&lt;url&gt;</code>. Pick or drop its <code>showcase.json</code> beside it, or open the page as <code>?series=&lt;url&gt;</code>, and the header names the series the match came from.</div>
</div>
<div id="header" class="header" hidden></div>
<div id="headline" class="headline" hidden></div>
<div id="stage" class="stage" hidden>
<div id="panel-a" class="panel" hidden></div>
<div id="board" class="board" hidden></div>
<div id="panel-b" class="panel" hidden></div>
</div>
<div id="controls" class="controls" hidden>
<div id="view-toggle" class="toggle" role="group" aria-label="Which view of the board" hidden></div>
<div id="turns" class="turns" role="group" aria-label="Replay controls" hidden></div>
</div>
<div id="chart" class="chart" hidden></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
